[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "taurido"
version = "0.1.0"
description = "Tauri + Docker bridge CLI (Python) based on Dock2Tauri launcher"
readme = "README.md"
authors = [
  { name = "digitaltwin-run", email = "" }
]
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = []

[project.urls]
Homepage = "https://github.com/digitaltwin-run/dock2tauri"

[project.scripts]
taurido = "taurido.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "build>=1",
  "ruff>=0.5",
]
