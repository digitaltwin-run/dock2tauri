[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "taurido"
version = "0.1.0"
description = "Python CLI for bridging Dockerized web apps into Tauri desktop apps"
readme = "README.md"
authors = [{ name = "digitaltwin-run" }]
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = []

[project.urls]
Homepage = "https://github.com/digitaltwin-run/dock2tauri"
Repository = "https://github.com/digitaltwin-run/dock2tauri"
Issues = "https://github.com/digitaltwin-run/dock2tauri/issues"

[project.scripts]
taurido = "taurido.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "build>=1",
  "ruff>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_taurido_*.py", "test_launcher_contract.py"]

[tool.ruff]
target-version = "py38"
line-length = 120
